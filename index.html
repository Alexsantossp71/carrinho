<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação 3D - Carrinho Realista</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 28px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 5px;
        }
        p {
            color: #8888a0;
            font-size: 14px;
        }
        .btn-restart {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0b0b16;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .btn-restart:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <h1>Three.js - Modelo GLB</h1>
        <p>Carregando o carrinho real do arquivo Trolly 125.glb</p>
    </div>

    <button class="btn-restart" onclick="resetAnimation()">Reiniciar Entrada</button>

    <div id="canvas-container"></div>

    <!-- Scripts do Three.js e do Carregador GLTF/GLB -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        let scene, camera, renderer, shoppingCart;
        let targetX = 0; 
        let isEntering = false; // Só ativa a movimentação quando o modelo terminar de carregar

        // Caminho exato apontando para o seu arquivo enviado
        const modelPath = './shopping-trolley2/source/Trolly 125.glb';

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b16);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8); // Subi um pouco a câmera para enquadrar melhor o modelo real
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Iluminação reforçada para destacar texturas e metais realistas do GLB
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionLight(0xffffff, 1.5);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionLight(0x00f2fe, 1.0);
            dirLight2.position.set(-5, 5, -5);
            scene.add(dirLight2);

            // Adiciona o grid no chão para dar noção de espaço tridimensional
            const gridHelper = new THREE.GridHelper(30, 30, 0x00f2fe, 0x222244);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // CARREGANDO O SEU MODELO 3D REAL (.GLB)
            const loader = new THREE.GLTFLoader();
            loader.load(
                modelPath, 
                function (gltf) {
                    shoppingCart = gltf.scene;

                    // Ajuste de escala (Modelos da internet às vezes vêm muito grandes ou muito pequenos)
                    // Se o carrinho sumir ou ficar gigante, mexa nesses valores abaixo:
                    shoppingCart.scale.set(1.5, 1.5, 1.5); 

                    // Define a rotação inicial para ele entrar "de frente" ou de lado conforme o eixo original
                    shoppingCart.rotation.y = Math.PI / 2; 

                    // Coloca o carrinho escondido na esquerda (fora da tela) para começar o slide
                    shoppingCart.position.set(-10, -1, 0); 
                    
                    scene.add(shoppingCart);
                    
                    // Libera a animação agora que o modelo está carregado na memória
                    isEntering = true;
                },
                undefined,
                function (error) {
                    console.error('Erro ao carregar o modelo 3D do carrinho:', error);
                }
            );

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Se o carrinho já foi carregado e está no estágio de entrada
            if (shoppingCart && isEntering) {
                // Interpolação suave em direção ao centro (X = 0)
                shoppingCart.position.x += (targetX - shoppingCart.position.x) * 0.04;
                
                // Se chegou bem perto do centro, para de andar e começa o giro de vitrine
                if (Math.abs(shoppingCart.position.x - targetX) < 0.01) {
                    shoppingCart.position.x = targetX;
                    isEntering = false;
                }
            } else if (shoppingCart) {
                // Rotação suave contínua no centro da tela
                shoppingCart.rotation.y += 0.008;
            }

            renderer.render(scene, camera);
        }

        function resetAnimation() {
            if (shoppingCart) {
                isEntering = true;
                shoppingCart.rotation.y = Math.PI / 2; // Reseta rotação para a posição de movimento
                shoppingCart.position.set(-10, -1, 0); // Joga de volta para fora da tela na esquerda
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
