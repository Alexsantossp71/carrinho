<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação 3D - Carrinho Realista</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 26px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 5px;
        }
        p {
            color: #8888a0;
            font-size: 14px;
        }
        #status-monitor {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffb703;
            border: 1px solid rgba(255, 183, 3, 0.3);
        }
        .btn-restart {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0b0b16;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .btn-restart:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <h1>Three.js - Carrinho de Compras</h1>
        <p>Modelo carregado via CDN estável</p>
    </div>

    <div id="status-monitor">🔄 Inicializando ambiente 3D...</div>

    <button class="btn-restart" onclick="resetAnimation()">Reiniciar Entrada</button>

    <div id="canvas-container"></div>

    <!-- CORREÇÃO FINAL: Scripts clássicos vinculados ao CDNJS oficiais e compatíveis -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        let scene, camera, renderer, shoppingCart;
        let targetX = 0; 
        let isEntering = false;

        // Caminho relativo exato do arquivo no seu repositório
        const modelPath = 'shopping-trolley2/source/Trolly 125.glb';

        function init() {
            const container = document.getElementById('canvas-container');
            const statusMonitor = document.getElementById('status-monitor');

            // Validação de scripts carregados globalmente no navegador
            if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
                statusMonitor.style.color = "#ff4757";
                statusMonitor.textContent = "❌ Falha: Os scripts 3D principais falharam. Atualize com CTRL + F5.";
                return;
            }

            // Criando a cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b16);

            // Criando a câmera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8); 
            camera.lookAt(0, 0, 0);

            // Criando o renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionLight(0xffffff, 1.5);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionLight(0x00f2fe, 1.2);
            dirLight2.position.set(-5, 5, -5);
            scene.add(dirLight2);

            // Grid espacial
            const gridHelper = new THREE.GridHelper(30, 30, 0x00f2fe, 0x222244);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // Inicializando o carregador através da nova instância global corrigida
            const loader = new THREE.GLTFLoader();
            statusMonitor.textContent = "⏳ Baixando arquivo 'Trolly 125.glb'...";
            
            loader.load(
                modelPath, 
                function (gltf) {
                    shoppingCart = gltf.scene;

                    // Ajustes de proporção do carrinho real
                    shoppingCart.scale.set(1.5, 1.5, 1.5); 
                    shoppingCart.rotation.y = Math.PI / 2; 
                    shoppingCart.position.set(-10, -1, 0); 
                    
                    scene.add(shoppingCart);
                    
                    statusMonitor.style.color = "#00f2fe";
                    statusMonitor.style.borderColor = "rgba(0, 242, 254, 0.4)";
                    statusMonitor.textContent = "✅ Sucesso! O carrinho está na tela.";
                    
                    isEntering = true;
                },
                function (xhr) {
                    if (xhr.total > 0) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        statusMonitor.textContent = `⏳ Carregando: ${percent}%`;
                    }
                },
                function (error) {
                    console.error(error);
                    statusMonitor.style.color = "#ff4757";
                    statusMonitor.style.borderColor = "rgba(255, 71, 87, 0.4)";
                    statusMonitor.textContent = "❌ Erro: Verifique se o nome do arquivo .glb está idêntico.";
                }
            );

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (shoppingCart && isEntering) {
                shoppingCart.position.x += (targetX - shoppingCart.position.x) * 0.04;
                
                if (Math.abs(shoppingCart.position.x - targetX) < 0.01) {
                    shoppingCart.position.x = targetX;
                    isEntering = false;
                }
            } else if (shoppingCart) {
                shoppingCart.rotation.y += 0.008;
            }

            renderer.render(scene, camera);
        }

        function resetAnimation() {
            if (shoppingCart) {
                isEntering = true;
                shoppingCart.rotation.y = Math.PI / 2; 
                shoppingCart.position.set(-10, -1, 0); 
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
