<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação 3D - Carrinho de Compras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 26px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 5px;
        }
        p {
            color: #8888a0;
            font-size: 14px;
        }
        .btn-restart {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0b0b16;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .btn-restart:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <h1>Three.js - Carrinho de Compras</h1>
        <p>Renderização 3D Nativa Estabilizada</p>
    </div>

    <button class="btn-restart" onclick="resetAnimation()">Reiniciar Entrada</button>

    <div id="canvas-container"></div>

    <!-- Apenas UMA biblioteca ultraestável via CDNJS da Cloudflare -->
    <script src="https://cloudflare.com"></script>

    <script>
        let scene, camera, renderer, shoppingCart;
        let targetX = 0; 
        let isEntering = true;

        function init() {
            const container = document.getElementById('canvas-container');

            // Inicializando a Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b16);

            // Configurando Câmera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7); 
            camera.lookAt(0, 0, 0);

            // Inicializando Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Configuração de Luzes Básicas
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionLight(0x00f2fe, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Adiciona o grid no chão para dar profundidade espacial
            const gridHelper = new THREE.GridHelper(30, 30, 0x00f2fe, 0x222244);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            // CONSTRUINDO O CARRINHO MANUALMENTE VIA GEOMETRIAS NATIVAS
            shoppingCart = new THREE.Group();

            const metalMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                wireframe: true,
                roughness: 0.2,
                metalness: 0.8
            });
            const blackMaterial = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.5 });

            // Cesto do Carrinho (Cubo Aramado)
            const basketGeo = new THREE.BoxGeometry(2, 1.2, 1.4);
            const basket = new THREE.Mesh(basketGeo, metalMaterial);
            basket.position.y = 0.6;
            shoppingCart.add(basket);

            // Grade Inferior (Chassi)
            const baseGeo = new THREE.BoxGeometry(2, 0.1, 1.2);
            const base = new THREE.Mesh(baseGeo, metalMaterial);
            base.position.y = -0.1;
            shoppingCart.add(base);

            // Hastes de suporte
            const barGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.7);
            const bar1 = new THREE.Mesh(barGeo, blackMaterial); bar1.position.set(0.7, 0.2, 0.5);
            const bar2 = bar1.clone(); bar2.position.set(-0.7, 0.2, 0.5);
            const bar3 = bar1.clone(); bar3.position.set(0.7, 0.2, -0.5);
            const bar4 = bar1.clone(); bar4.position.set(-0.7, 0.2, -0.5);
            shoppingCart.add(bar1, bar2, bar3, bar4);

            // Rodas (Cilindros deitados)
            const wheelGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16);
            wheelGeo.rotateZ(Math.PI / 2); 

            const wheel1 = new THREE.Mesh(wheelGeo, blackMaterial); wheel1.position.set(0.7, -0.35, 0.5);
            const wheel2 = wheel1.clone(); wheel2.position.set(-0.7, -0.35, 0.5);
            const wheel3 = wheel1.clone(); wheel3.position.set(0.7, -0.35, -0.5);
            const wheel4 = wheel1.clone(); wheel4.position.set(-0.7, -0.35, -0.5);
            shoppingCart.add(wheel1, wheel2, wheel3, wheel4);

            // Alça de empurrar
            const handleGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.4);
            handleGeo.rotateX(Math.PI / 2);
            const handle = new THREE.Mesh(handleGeo, blackMaterial);
            handle.position.set(-1.05, 1.1, 0);
            shoppingCart.add(handle);

            // Define posição inicial escondido na esquerda
            shoppingCart.position.set(-10, 0, 0);
            scene.add(shoppingCart);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (shoppingCart && isEntering) {
                // Movimento suave de entrada em direção ao centro (X = 0)
                shoppingCart.position.x += (targetX - shoppingCart.position.x) * 0.04;
                
                // Rotaciona as rodas simulando o movimento
                shoppingCart.children.forEach(child => {
                    if(child.geometry && child.geometry.type === "CylinderGeometry" && child.position.y < 0) {
                        child.rotation.z -= 0.15;
                    }
                });

                if (Math.abs(shoppingCart.position.x - targetX) < 0.01) {
                    shoppingCart.position.x = targetX;
                    isEntering = false;
                }
            } else if (shoppingCart) {
                // Gira suavemente no showroom após estacionar no centro
                shoppingCart.rotation.y += 0.01;
            }

            renderer.render(scene, camera);
        }

        function resetAnimation() {
            if (shoppingCart) {
                isEntering = true;
                shoppingCart.rotation.y = 0; 
                shoppingCart.position.set(-10, 0, 0); 
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
