<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho Cheio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b16;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh}
.ui{position:absolute;top:20px;width:100%;text-align:center;z-index:10;pointer-events:none}
#status{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.8);padding:6px 14px;border-radius:20px;font-size:12px;color:#ffb703;border:1px solid #333}
#panel{position:absolute;top:110px;left:15px;z-index:20;background:rgba(0,0,0,.75);padding:12px;border-radius:12px;font-size:12px;width:210px}
#panel label{display:flex;justify-content:space-between;margin:6px 0}
#panel input{width:90px}
#canvas{width:100%;height:100vh}
</style>
</head>
<body>
<div class="ui"><h1 style="color:#00f2fe;font-size:18px">AJUSTE A CESTA</h1></div>
<div id="status">🔄 Carregando...</div>

<div id="panel">
  <b>Calibrar cesta [ao vivo]</b>
  <label>Y altura <input id="sY" type="range" min="0" max="1.5" step="0.01" value="0.72"></label>
  <label>Z frente <input id="sZ" type="range" min="-0.5" max="0.5" step="0.01" value="0.05"></label>
  <label>Largura <input id="sW" type="range" min="0.1" max="1.5" step="0.01" value="0.55"></label>
  <label>Profund. <input id="sD" type="range" min="0.1" max="1.5" step="0.01" value="0.75"></label>
  <div style="margin-top:8px;color:#888">Ajuste até a caixa verde ficar DENTRO do carrinho. Depois me mande os valores.</div>
</div>

<div id="canvas"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene,camera,renderer,controls,shoppingCart,grupoProdutos,helperCesta;
const clock=new THREE.Clock();
const BASE='./kenney-mini-market/Models/glb/';
const statusEl=document.getElementById('status');

const CESTA={x:0,y:0.72,z:0.05,largura:0.55,altura:0.35,profundidade:0.75};

function setStatus(m,ok=null){statusEl.textContent=m; statusEl.style.color=ok===true?'#00f2fe':ok===false?'#ff4757':'#ffb703';}

const loader=new GLTFLoader();
const cache=new Map();
function corrigir(o){o.traverse(m=>{if(!m.isMesh)return;const mats=Array.isArray(m.material)?m.material:[m.material];mats.forEach(mat=>{if(mat?.map){mat.map.magFilter=THREE.NearestFilter;mat.map.minFilter=THREE.LinearMipmapLinearFilter;mat.map.anisotropy=renderer.capabilities.getMaxAnisotropy();}mat.roughness=0.85;mat.metalness=0;});m.castShadow=m.receiveShadow=true;});}
async function loadKenney(n){const url=BASE+n;if(cache.has(url))return(await cache.get(url)).clone(true);const p=loader.loadAsync(url).then(g=>{corrigir(g.scene);return g.scene;});cache.set(url,p);return(await p).clone(true);}

function init(){
  const cont=document.getElementById('canvas');
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0b16);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);camera.position.set(1.2,1.8,2.2);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;cont.appendChild(renderer.domElement);
  controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0.8,0);
  scene.add(new THREE.AmbientLight(0xffffff,1.2));
  const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(5,10,7);d.castShadow=true;scene.add(d);
  const grid=new THREE.GridHelper(10,10,0x00f2fe,0x222244);grid.position.y=0.01;scene.add(grid);
  carregarCarrinho();
  setupSliders();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  animate();
}

async function carregarCarrinho(){
  try{
    setStatus('⏳ Carregando shopping-cart.glb...');
    const model=await loadKenney('shopping-cart.glb');
    const box=new THREE.Box3().setFromObject(model);
    const size=box.getSize(new THREE.Vector3());
    const escala=2.2/Math.max(size.x,size.y,size.z);
    model.scale.setScalar(escala);
    model.position.set(-box.min.x*escala,-box.min.y*escala,-box.min.z*escala);

    // CALCULA CESTA AUTOMÁTICO
    const box2=new THREE.Box3().setFromObject(model);
    const s=box2.getSize(new THREE.Vector3());
    CESTA.y=s.y*0.62; CESTA.largura=s.x*0.52; CESTA.profundidade=s.z*0.58; CESTA.z=s.z*0.08;
    document.getElementById('sY').value=CESTA.y; document.getElementById('sZ').value=CESTA.z;
    document.getElementById('sW').value=CESTA.largura; document.getElementById('sD').value=CESTA.profundidade;

    shoppingCart=new THREE.Group(); shoppingCart.add(model); shoppingCart.position.set(-3,0,0); scene.add(shoppingCart);
    setStatus('✅ Carrinho ok - ajuste a caixa verde',true);
    encherCarrinho();
  }catch(e){console.error(e); setStatus('❌ Não achei '+BASE+'shopping-cart.glb',false);}
}

function encherCarrinho(){
  if(!shoppingCart)return;
  if(grupoProdutos)shoppingCart.remove(grupoProdutos);
  grupoProdutos=new THREE.Group(); shoppingCart.add(grupoProdutos);

  helperCesta=new THREE.Mesh(new THREE.BoxGeometry(CESTA.largura,CESTA.altura,CESTA.profundidade), new THREE.MeshBasicMaterial({color:0x00ff88,wireframe:true}));
  helperCesta.position.set(CESTA.x,CESTA.y,CESTA.z);
  grupoProdutos.add(helperCesta);

  // PRODUTOS PROCEDURAIS QUE CABEM - no estilo Kenney
  const cores=[0xe63946,0xf1c40f,0x2a9d8f,0xe76f51,0x457b9d,0xf4a261,0xffffff];
  for(let i=0;i<16;i++){
    const isCan=i%3===1; const isBox=i%3===0;
    const h=isBox?0.22+Math.random()*0.1:isCan?0.20:0.14;
    const geo=isBox?new THREE.BoxGeometry(0.16,h,0.10):isCan?new THREE.CylinderGeometry(0.06,0.06,h,16):new THREE.SphereGeometry(h/2,12,10);
    const mat=new THREE.MeshStandardMaterial({color:cores[i%cores.length],roughness:0.8});
    const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.position.y=h/2;
    const w=new THREE.Group(); w.add(m); w.userData.h=h;
    
    const col=i%4; const row=Math.floor(i/4);
    const px=(col/3-0.5)*CESTA.largura*0.7 + (Math.random()-0.5)*0.05;
    const pz=(row/3-0.5)*CESTA.profundidade*0.6 + (Math.random()-0.5)*0.05;
    const py= (row%2)*0.12; // 2 camadas
    w.position.set(CESTA.x+px, CESTA.y-CESTA.altura/2+py+0.02, CESTA.z+pz);
    w.rotation.y=Math.random()*6.28;
    grupoProdutos.add(w);
  }
}

function setupSliders(){
  const els={y:document.getElementById('sY'),z:document.getElementById('sZ'),w:document.getElementById('sW'),d:document.getElementById('sD')};
  Object.values(els).forEach(el=>el.addEventListener('input',()=>{
    CESTA.y=parseFloat(els.y.value); CESTA.z=parseFloat(els.z.value);
    CESTA.largura=parseFloat(els.w.value); CESTA.profundidade=parseFloat(els.d.value);
    if(helperCesta){helperCesta.position.set(CESTA.x,CESTA.y,CESTA.z); helperCesta.scale.set(CESTA.largura/0.55,1,CESTA.profundidade/0.75); }
    console.log('CESTA =',JSON.stringify(CESTA));
  }));
}

function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(shoppingCart){if(shoppingCart.position.x<-0.01){shoppingCart.position.x=THREE.MathUtils.damp(shoppingCart.position.x,0,2,dt);}else shoppingCart.rotation.y+=0.2*dt;}controls.update();renderer.render(scene,camera);}
init();
</script>
</body>
</html>
