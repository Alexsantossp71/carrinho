<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação 3D - Carrinho de Compras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 26px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 5px;
        }
        p {
            color: #8888a0;
            font-size: 14px;
        }
        #status-monitor {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            color: #ffb703;
            border: 1px solid rgba(255, 183, 3, 0.3);
        }
        .btn-restart {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0b0b16;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .btn-restart:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <h1>Three.js - Carrinho de Compras</h1>
        <p>Renderização com Módulos Corrigidos</p>
    </div>

    <div id="status-monitor">🔄 Inicializando o ambiente tridimensional...</div>

    <button class="btn-restart" id="restartBtn">Reiniciar Entrada</button>

    <div id="canvas-container"></div>

    <!-- Import Map Seguro: Mapeia as dependências diretamente sem redirecionamentos complexos -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://jsdelivr.net",
                "three/addons/": "https://jsdelivr.net"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, shoppingCart;
        let targetX = 0; 
        let isEntering = false;

        // Estrutura de pastas do seu repositório
        const modelPath = 'shopping-trolley2/source/Trolly 125.glb';
        const statusMonitor = document.getElementById('status-monitor');

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b16);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Ajuste completo de luzes para materiais metálicos PBR do modelo real
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionLight(0xffffff, 1.5);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionLight(0x00f2fe, 1.2);
            dirLight2.position.set(-5, 5, -5);
            scene.add(dirLight2);

            const gridHelper = new THREE.GridHelper(30, 30, 0x00f2fe, 0x222244);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // Carregador assíncrono oficial
            const loader = new GLTFLoader();
            statusMonitor.textContent = "⏳ Conectando ao arquivo 'Trolly 125.glb'...";
            
            loader.load(
                modelPath, 
                function (gltf) {
                    shoppingCart = gltf.scene;

                    // Ajuste de proporção para o tamanho ideal de tela
                    shoppingCart.scale.set(1.5, 1.5, 1.5); 
                    shoppingCart.rotation.y = Math.PI / 2; 
                    shoppingCart.position.set(-10, -1, 0); 
                    
                    scene.add(shoppingCart);
                    
                    statusMonitor.style.color = "#00f2fe";
                    statusMonitor.style.borderColor = "rgba(0, 242, 254, 0.4)";
                    statusMonitor.textContent = "✅ Modelo carregado com sucesso!";
                    
                    isEntering = true;
                },
                function (xhr) {
                    if (xhr.total > 0) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        statusMonitor.textContent = `⏳ Carregando elementos 3D: ${percent}%`;
                    }
                },
                function (error) {
                    console.error(error);
                    statusMonitor.style.color = "#ff4757";
                    statusMonitor.style.borderColor = "rgba(255, 71, 87, 0.4)";
                    statusMonitor.textContent = "❌ Erro: Verifique se a pasta ou o nome do arquivo mudou.";
                }
            );

            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('restartBtn').addEventListener('click', resetAnimation);
            
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (shoppingCart && isEntering) {
                // Efeito deslizante linear em direção ao centro (X = 0)
                shoppingCart.position.x += (targetX - shoppingCart.position.x) * 0.04;
                
                if (Math.abs(shoppingCart.position.x - targetX) < 0.01) {
                    shoppingCart.position.x = targetX;
                    isEntering = false;
                }
            } else if (shoppingCart) {
                // Rotação suave contínua quando chega no meio
                shoppingCart.rotation.y += 0.008;
            }

            renderer.render(scene, camera);
        }

        function resetAnimation() {
            if (shoppingCart) {
                isEntering = true;
                shoppingCart.rotation.y = Math.PI / 2; 
                shoppingCart.position.set(-10, -1, 0); 
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
